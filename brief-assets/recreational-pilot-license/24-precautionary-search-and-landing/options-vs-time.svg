<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="sans-serif" role="img">
  <rect width="800" height="450" fill="white"/>
  <!-- decision window and committed zones -->
  <rect x="80" y="30" width="250" height="330" fill="#2e8b57" fill-opacity="0.14"/>
  <rect x="560" y="30" width="190" height="330" fill="#c0392b" fill-opacity="0.14"/>
  <text x="205" y="52" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f6b41">Decide here</text>
  <text x="655" y="52" text-anchor="middle" font-size="18" font-weight="bold" fill="#a02c20">Committed</text>
  <!-- axes -->
  <path d="M80 30 V360 H750" fill="none" stroke="#222" stroke-width="2"/>
  <text x="415" y="410" text-anchor="middle" font-size="18" fill="#222">Time as conditions deteriorate →</text>
  <text transform="translate(28 195) rotate(-90)" text-anchor="middle" font-size="18" fill="#222">Your options →</text>
  <!-- options curve -->
  <path d="M80 80 C 220 84, 300 120, 380 190 S 560 330, 750 356" fill="none" stroke="#1a4f8a" stroke-width="5"/>
  <!-- step markers -->
  <g fill="#1a4f8a" stroke="white" stroke-width="3">
    <circle cx="120" cy="81" r="9"/>
    <circle cx="290" cy="108" r="9"/>
    <circle cx="450" cy="251" r="9"/>
    <circle cx="640" cy="335" r="9"/>
  </g>
  <g font-size="16" fill="#222" text-anchor="middle">
    <text x="120" y="385">Step 1</text>
    <text x="290" y="385">Step 2</text>
    <text x="450" y="385">Step 3</text>
    <text x="640" y="385">Step 4</text>
  </g>
  <!-- what drains -->
  <g font-size="15" fill="#444">
    <text x="95" y="175">height, fields, daylight, fuel, calm</text>
    <text x="470" y="215">fewer fields, worse visibility</text>
    <text x="570" y="290">no good field left</text>
  </g>
</svg>
